<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión Wi-Fi Escolar</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px 20px; background-color: #0d1117; color: #c9d1d9; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; display: inline-block; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #f85149; font-size: 1.8em; margin-bottom: 15px; }
        p { color: #8b949e; line-height: 1.6; font-size: 1.05em; }
        .icon { font-size: 3em; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">⚠️</span>
        <h1>Servicio No Disponible</h1>
        <p>Lo sentimos, en este momento <strong>aún no está habilitada la red estudiantil de alta velocidad</strong> en esta área del plantel.</p>
        <p>Por favor, intenta conectarte más tarde o acude al Departamento de Soporte Técnico.</p>
    </div>
</body>
</html>
